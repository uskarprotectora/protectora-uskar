<!DOCTYPE html>
<html lang="es" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protectora de Animales Uskar</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pages/about.css">
    <link rel="stylesheet" href="css/pages/contact.css">
</head>
<body>
    <div class="app-window">
        <!-- Barra de Título -->
        <div class="title-bar">
            <div class="title-bar-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <div class="app-icon">🐾</div>
                <span class="app-name" data-i18n="app.name">Protectora de Animales Uskar</span>
            </div>
            <input type="text" class="search-box" id="searchInput" placeholder="Buscar por nombre, raza..." data-i18n-placeholder="search.placeholder">
            <div class="window-controls">
                <div class="lang-selector" id="langSelector">
                    <button class="lang-btn" id="langBtn">
                        <span class="lang-flag">🇪🇸</span>
                        <span class="lang-text" data-i18n="language">Idioma</span>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <button class="lang-option" data-lang="es">
                            <span>🇪🇸</span>
                            <span>Español</span>
                        </button>
                        <button class="lang-option" data-lang="en">
                            <span>🇬🇧</span>
                            <span>English</span>
                        </button>
                    </div>
                </div>
                <button class="login-btn" id="loginBtn">
                    <span>👤</span>
                    <span data-i18n="login">Iniciar Sesión</span>
                </button>
            </div>
        </div>

        <!-- Contenedor Principal -->
        <div class="main-container">
            <!-- Overlay para cerrar menú en móvil -->
            <div class="sidebar-overlay" id="sidebarOverlay"></div>

            <!-- Barra Lateral -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title" data-i18n="sidebar.forms">Formulario</div>
                    <button class="adoption-form-btn" id="openAdoptionFormBtn">
                        <span>📋</span>
                        <span data-i18n="sidebar.adoptionForm">Formulario de Adopción</span>
                    </button>
                    <button class="adoption-form-btn admin-only" id="viewAdoptionRequestsBtn">
                        <span>📊</span>
                        <span data-i18n="sidebar.adoptionRequests">Solicitudes Adopción</span>
                    </button>
                    <button class="adoption-form-btn admin-only" id="viewFormsBtn">
                        <span>📝</span>
                        <span data-i18n="sidebar.otherForms">Otros Formularios</span>
                    </button>
                </div>

                <div class="filter-section">
                    <div class="filter-title" data-i18n="sidebar.discover">Descubre nuestros animales</div>
                    <button class="filter-btn active" data-filter="view" data-value="adoption">
                        <span class="filter-icon">🐾</span>
                        <span data-i18n="sidebar.adoptionAnimals">Animales en adopción</span>
                    </button>
                    <button class="filter-btn" data-filter="view" data-value="happy">
                        <span class="filter-icon">🏠</span>
                        <span data-i18n="sidebar.happyEndings">Finales Felices</span>
                    </button>
                </div>

                <div class="filter-section">
                    <div class="filter-title" data-i18n="sidebar.aboutUs">Conócenos</div>
                    <button class="filter-btn" data-filter="view" data-value="about">
                        <span class="filter-icon">ℹ️</span>
                        <span data-i18n="sidebar.whoWeAre">Quiénes somos</span>
                    </button>
                    <button class="filter-btn" data-filter="view" data-value="contact">
                        <span class="filter-icon">📞</span>
                        <span data-i18n="sidebar.contact">Contáctanos</span>
                    </button>
                </div>

                <div class="filter-section">
                    <div class="filter-title" data-i18n="sidebar.helpUs">Ayúdanos</div>
                    <button class="filter-btn help-btn" data-action="donaciones">
                        <span class="filter-icon">💝</span>
                        <span data-i18n="sidebar.donations">Donaciones</span>
                    </button>
                    <button class="filter-btn help-btn" data-action="apadrina">
                        <span class="filter-icon">❤️</span>
                        <span data-i18n="sidebar.sponsor">Apadrina un Animal</span>
                    </button>
                    <button class="filter-btn help-btn" data-action="facturas">
                        <span class="filter-icon">🏥</span>
                        <span data-i18n="sidebar.vetBills">Facturas Veterinarias</span>
                    </button>
                    <button class="filter-btn help-btn" data-action="voluntariado">
                        <span class="filter-icon">🤝</span>
                        <span data-i18n="sidebar.volunteering">Voluntariado</span>
                    </button>
                    <button class="filter-btn help-btn" data-action="casaAcogida">
                        <span class="filter-icon">🏠</span>
                        <span data-i18n="sidebar.fosterHome">Casa de Acogida</span>
                    </button>
                    <button class="filter-btn help-btn" data-action="teaming">
                        <span class="filter-icon">👥</span>
                        <span data-i18n="sidebar.teaming">Teaming</span>
                    </button>
                </div>

                <div class="filter-section">
                    <div class="filter-title" data-i18n="sidebar.opinion">Tu opinión</div>
                    <button class="filter-btn help-btn feedback-btn" data-action="feedback">
                        <span class="filter-icon">💬</span>
                        <span data-i18n="sidebar.feedback">Danos tu opinión</span>
                    </button>
                </div>

                <div class="stats-section">
                    <div class="stat-item">
                        <span class="stat-label" data-i18n="stats.total">Total Animales</span>
                        <span class="stat-value" id="totalPets">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" data-i18n="stats.dogs">Perros</span>
                        <span class="stat-value" id="totalDogs">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" data-i18n="stats.cats">Gatos</span>
                        <span class="stat-value" id="totalCats">0</span>
                    </div>
                </div>
            </div>

            <!-- Area de Contenido -->
            <div class="content-area">
                <div class="content-header">
                    <div>
                        <h1 class="content-title" data-i18n="content.title">Nuestros Animales</h1>
                        <p class="content-subtitle" data-i18n="content.subtitle">Conoce a los animales que buscan un hogar</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-primary admin-only" id="addPetBtn">
                            <span>➕</span>
                            <span data-i18n="content.newAnimal">Nuevo Animal</span>
                        </button>
                    </div>
                </div>

                <div class="filters-bar" id="filtersBar">
                    <div class="filter-item">
                        <label class="filter-label" data-i18n="filter.age">Edad:</label>
                        <select class="filter-select" id="ageRangeFilter">
                            <option value="all" data-i18n="filter.allAges">Todas las edades</option>
                            <option value="puppy" data-i18n="filter.puppy">Cachorro (0-1 año)</option>
                            <option value="young" data-i18n="filter.young">Joven (1-3 años)</option>
                            <option value="adult" data-i18n="filter.adult">Adulto (3-7 años)</option>
                            <option value="senior" data-i18n="filter.senior">Senior (7+ años)</option>
                        </select>
                    </div>
                </div>

                <div class="content-body">
                    <div class="pets-grid" id="petsGrid">
                        <!-- Las tarjetas se renderizarán aquí -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor para modales cargados dinámicamente -->
    <div id="modals-container"></div>

    <!-- Configuración -->
    <script src="js/config.js"></script>

    <!-- Internacionalización -->
    <script src="js/i18n.js"></script>

    <!-- Utilidades y Estado -->
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/componentLoader.js"></script>
    <script src="js/state.js"></script>

    <!-- API -->
    <script src="js/api.js"></script>

    <!-- Componentes -->
    <script src="js/components/auth.js"></script>
    <script src="js/components/petCard.js"></script>
    <script src="js/components/petProfile.js"></script>
    <script src="js/components/helpModals.js"></script>
    <script src="js/components/adoptionForm.js"></script>
    <script src="js/components/petForm.js"></script>

    <!-- Páginas -->
    <script src="js/pages/about.js"></script>
    <script src="js/pages/contact.js"></script>
    <script src="js/pages/requests.js"></script>
    <script src="js/pages/forms.js"></script>

    <!-- Aplicación Principal -->
    <script src="js/app-main.js"></script>
</body>
</html>
